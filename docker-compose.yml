services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: terrain-building-stl-web:local
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      APP_DATA_DIR: ${APP_DATA_DIR:-/workspace/data}
      APP_OUTPUT_DIR: ${APP_OUTPUT_DIR:-/workspace/output}
      APP_SAMPLE_DIR: ${APP_SAMPLE_DIR:-/workspace/data/sample}
    volumes:
      - .:/workspace
    command: ["uvicorn", "web_api.app:app", "--host", "0.0.0.0", "--port", "8000"]
